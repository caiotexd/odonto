<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - {{ clinica }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar Unificada com Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('auth.dashboard') }}">{{ clinica }}</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="{{ url_for('auth.dashboard') }}">Painel</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('auth.pacientes_lista') }}">Pacientes</a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center text-white">
                    <span class="me-3">Olá, <strong>{{ nome }}</strong></span>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm">Sair</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container my-4">
        <div class="row">
            <div class="col-md-12">
                <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
                    <h1 class="display-5 fw-bold text-primary">Bem-vindo ao Painel!</h1>
                    <p class="col-md-8 fs-4 text-muted">
                        A sua sessão foi iniciada com sucesso. Os dados apresentados aqui são totalmente isolados para a <strong>{{ clinica }}</strong>.
                    </p>
                    <hr class="my-4">
                    <div class="row text-center">
                        <div class="col-md-4 mb-3">
                            <div class="card border-0 bg-primary bg-opacity-10 p-3">
                                <h3 class="fw-bold text-primary">0</h3>
                                <p class="mb-0 text-muted">Consultas Hoje</p>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="card border-0 bg-success bg-opacity-10 p-3">
                                <h3 class="fw-bold text-success">0</h3>
                                <p class="mb-0 text-muted">Pacientes Registados</p>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="card border-0 bg-info bg-opacity-10 p-3">
                                <h3 class="fw-bold text-info">R$ 0,00</h3>
                                <p class="mb-0 text-muted">Faturação do Mês</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
